# Proxy reverso + cache na frente do servidor Next.js (serviço "web").

# Cache em disco, no volume nomeado montado em /var/cache/nginx.
proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app_cache:10m
                 max_size=200m inactive=60m use_temp_path=off;

upstream nextjs {
    # "web" é resolvido pelo DNS interno do Docker na rede "backend".
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml;

    # Declarados no nível do server para valer em todas as locations
    # (diretivas proxy_* repetidas numa location anulam as herdadas).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache app_cache;
    proxy_cache_valid 200 301 302 10m;
    # Se o Next cair, continua servindo a última versão em cache.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;

    # Mostra HIT/MISS no cabeçalho, útil para ver o cache funcionando.
    add_header X-Cache-Status $upstream_cache_status always;

    # Usado pelo healthcheck do compose; não passa pelo Next.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome: nunca mudam, podem ficar em cache por muito tempo.
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 7d;
    }

    location / {
        proxy_pass http://nextjs;
    }
}
